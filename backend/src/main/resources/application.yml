server:
  port: ${PORT:8080}

spring:
  application:
    name: docuvault-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgres}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_MB:250}MB
      max-request-size: ${MAX_UPLOAD_MB:250}MB
  jpa:
    open-in-view: false
    show-sql: false

docuvault:
  storage:
    driver: ${STORAGE_DRIVER:local}
    local-path: ${LOCAL_STORAGE_PATH:./storage}
  aws:
    region: ${AWS_REGION:us-east-1}
    s3-bucket: ${S3_BUCKET:your-docuvault-bucket}
    s3-kms-key-id: ${S3_KMS_KEY_ID:}
    s3-presigned-url-ttl: ${S3_PRESIGNED_URL_TTL:300}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:docuvault-super-secure-production-ready-jwt-access-secret-key-32-chars}
    refresh-secret: ${JWT_REFRESH_SECRET:docuvault-super-secure-production-ready-jwt-refresh-secret-key-32-chars}
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000
  cors:
    allowed-origins: ${CLIENT_ORIGIN:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5500,http://localhost:8080}
  seed:
    admin-email: ${ADMIN_EMAIL:admin@docuvault.local}
    admin-password: ${ADMIN_PASSWORD:Admin@12345}
    admin-name: ${ADMIN_NAME:System Administrator}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/docuvault}
    username: ${PGUSER:docuvault}
    password: ${PGPASSWORD:docuvault}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:docuvault;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
