<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — DocuVault</title>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('dv_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));</script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-visual">
    <div class="row gap-1">
      <span class="seal seal-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5l-8-3Z"/></svg></span>
      <span style="font-family:var(--font-display); font-weight:600; font-size:1.15rem;">DocuVault</span>
    </div>
    <p class="quote">"Storage quotas, role tiers, and audit trails — set up once, ready before your first upload."</p>
    <div class="text-xs" style="color:#6a6e94;">— Product principle #2</div>
  </div>

  <div class="auth-form-wrap">
    <div class="auth-card">
      <div class="brand-mark">
        <span class="seal seal-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5l-8-3Z"/></svg></span>
        <span>DocuVault</span>
      </div>
      <h2>Create your account</h2>
      <p class="text-soft" style="margin-bottom:1.6rem;">Start with 5 GB of vault space, free.</p>

      <form id="register-form" novalidate>
        <div class="field">
          <label for="fullName">Full name</label>
          <input class="input" type="text" id="fullName" name="fullName" placeholder="Jordan Reyes" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input class="input" type="email" id="email" name="email" placeholder="you@company.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" required minlength="8">
          <span class="field-hint">Use 8+ characters. Mix in a number for good measure.</span>
        </div>
        <label class="checkbox-row" style="margin-bottom:1.3rem;"><input type="checkbox" required> I agree to the Terms and Privacy Policy</label>
        <button class="btn btn-primary" type="submit" style="width:100%;" id="submit-btn">
          <span id="submit-label">Create account</span>
        </button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>
</div>

<script src="js/theme.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/notifications.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
