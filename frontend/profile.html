<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — DocuVault</title>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('dv_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));</script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="loading-screen" id="loading-screen">
  <span class="seal spin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5l-8-3Z"/></svg></span>
  <p>Unsealing your vault…</p>
</div>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="seal seal-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5l-8-3Z"/></svg></span>
      <span>DocuVault</span>
    </div>
    <nav class="nav-group">
      <span class="nav-group-label">Workspace</span>
      <a class="nav-link" data-page="dashboard.html" href="dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        Dashboard
      </a>
      <a class="nav-link" data-page="upload.html" href="upload.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3m0 12-4-4m4 4 4-4"/><path d="M20 15v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4"/></svg>
        Upload Center
      </a>
      <a class="nav-link" data-page="explorer.html" href="explorer.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
        File Explorer
      </a>
      <a class="nav-link" data-page="shared.html" href="shared.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Shared Documents
      </a>
    </nav>
    <nav class="nav-group">
      <span class="nav-group-label">Account</span>
      <a class="nav-link active" data-page="profile.html" href="profile.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        Profile
      </a>
      <a class="nav-link" data-page="admin.html" href="admin.html" data-admin-only style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5l-8-3Z"/></svg>
        Admin Panel
      </a>
      <a class="nav-link" data-logout href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
        Log out
      </a>
    </nav>
    <div class="sidebar-storage">
      <div class="row" style="justify-content:space-between;">
        <span class="text-xs" style="color:var(--sidebar-ink-dim); font-weight:600;">STORAGE</span>
        <span class="text-xs mono" id="sidebar-storage-text" style="color:var(--sidebar-ink-dim);">…</span>
      </div>
      <div class="bar-track"><div class="bar-fill" id="sidebar-storage-bar" style="width:0%;"></div></div>
      <p>Upgrade for more space anytime.</p>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <button class="menu-toggle" data-menu-toggle aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <h3 class="mt-0 mb-0">Profile</h3>
      <div class="topbar-actions">
        <button class="btn btn-icon" data-theme-toggle title="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <div class="avatar" data-user-initial>·</div>
      </div>
    </header>

    <main class="content">
      <div class="grid-cols" style="grid-template-columns: 1fr 1.4fr; align-items:start;">
        <div class="card card-pad" style="text-align:center;">
          <div class="avatar avatar-lg" style="margin:0 auto 1rem;" data-user-initial>·</div>
          <h3 class="mb-0" data-user-name>—</h3>
          <p class="text-sm text-faint" data-user-email>—</p>
          <span class="badge badge-brass" data-user-role style="text-transform:capitalize;">member</span>

          <div class="row gap-2" style="justify-content:center; margin-top:1.6rem;">
            <div class="ring-wrap">
              <canvas id="usage-ring" width="120" height="120" style="width:120px;height:120px;"></canvas>
              <div class="ring-label"><b id="ring-pct">0%</b><span>USED</span></div>
            </div>
          </div>
          <p class="text-xs text-faint" id="usage-detail" style="margin-top:0.8rem;">—</p>
        </div>

        <div class="stack gap-3">
          <div class="card card-pad">
            <h4 class="mt-0">Profile information</h4>
            <form id="profile-form">
              <div class="field"><label>Full name</label><input class="input" id="fullName" required></div>
              <div class="field"><label>Email</label><input class="input" id="emailDisplay" disabled></div>
              <button class="btn btn-primary btn-sm" type="submit">Save changes</button>
            </form>
          </div>

          <div class="card card-pad">
            <h4 class="mt-0">Change password</h4>
            <form id="password-form">
              <div class="field"><label>Current password</label><input class="input" type="password" id="currentPassword" required></div>
              <div class="field"><label>New password</label><input class="input" type="password" id="newPassword" minlength="8" required></div>
              <button class="btn btn-ghost btn-sm" type="submit">Update password</button>
            </form>
          </div>

          <div class="card card-pad">
            <div class="row" style="justify-content:space-between;">
              <h4 class="mt-0 mb-0">Recent activity</h4>
            </div>
            <div id="my-activity" style="margin-top:0.8rem;">
              <div class="skeleton" style="height:40px; margin-bottom:0.5rem;"></div>
              <div class="skeleton" style="height:40px;"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/theme.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/notifications.js"></script>
<script src="js/layout.js"></script>
<script src="js/charts.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
